name: Сообщения боту WE
on:
  schedule:
    - cron: '*/10 * * * *'    # каждые 10 минут: /start и команды
  workflow_dispatch:
concurrency: {group: we-state, cancel-in-progress: false}
permissions: {contents: write}
jobs:
  peek:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs: {pending: '${{ steps.p.outputs.pending }}'}
    steps:
      - id: p
        env: {TG_TOKEN: '${{ secrets.TG_TOKEN }}'}
        run: |
          N=$(curl -s "https://api.telegram.org/bot$TG_TOKEN/getUpdates?timeout=0&limit=1" | python3 -c "import sys,json;print(len(json.load(sys.stdin).get('result',[])))" || echo 0)
          echo "pending=$N" >> $GITHUB_OUTPUT
  handle:
    needs: peek
    if: needs.peek.outputs.pending != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WE_CLOUD: '1'
      WE_STATE_DIR: ${{ github.workspace }}/persist/state
      WE_DATA_DIR: ${{ github.workspace }}/persist/data
      IIKO_ACCOUNTS: ${{ secrets.IIKO_ACCOUNTS }}
      TG_TOKEN: ${{ secrets.TG_TOKEN }}
      ALLOWED_PHONES: ${{ secrets.ALLOWED_PHONES }}
      ALLOWED_USERNAMES: ${{ secrets.ALLOWED_USERNAMES }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: {ref: state, path: persist}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -r requirements.txt
      - run: python poll.py --once
      - name: Сохранить состояние
        if: always()
        run: |
          cd persist
          git config user.name "we-bot"; git config user.email "we-bot@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then git commit -m "state $(date -u +%F' '%T)"; for i in 1 2 3; do git pull --rebase origin state && git push origin state && break || sleep 5; done; fi
