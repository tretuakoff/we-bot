<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Интерактивный дашборд</title>
<style>
:root{--navy:#1F3864;--or:#E8833A;--gr:#2E9E6B;--rd:#D64545;--am:#F2A93B;--tx:#1d2433;--mu:#7A8599;--bg:#F3F5F9;--ln:#DDE2EB}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--navy);color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
header h1{font-size:18px;margin:0}header .sub{color:#C9D3EA;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
button,.btn{border:1px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font-size:13px}
button.on{background:#fff;color:var(--navy);font-weight:600}
input[type=date],input[type=search]{border:1px solid #ffffff55;background:#ffffff14;color:#fff;border-radius:8px;padding:4px 8px;font-size:13px}
input[type=search]{min-width:160px}input::placeholder{color:#C9D3EA}
main{padding:16px 20px;max-width:1500px;margin:auto}
.chip{display:inline-flex;gap:6px;align-items:center;background:var(--or);color:#fff;border-radius:14px;padding:3px 10px;font-size:12px;margin-left:6px}.chip b{cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.card{background:#fff;border:1px solid var(--ln);border-left:5px solid var(--navy);border-radius:12px;padding:12px 14px;cursor:pointer;transition:.15s;position:relative}
.card:hover{box-shadow:0 4px 14px #1f38641f;transform:translateY(-1px)}.card.act{outline:2px solid var(--or)}
.card h3{margin:0;font-size:12px;color:var(--mu);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.card .v{font-size:24px;font-weight:700;margin:4px 0}.card .d{font-size:12px}.up{color:var(--gr)}.dn{color:var(--rd)}.nt{color:var(--mu)}
.card.bad{border-left-color:var(--rd)}.card.warn{border-left-color:var(--am)}.card.ok{border-left-color:var(--gr)}
.spark{position:absolute;right:10px;bottom:10px;opacity:.85}
section{background:#fff;border:1px solid var(--ln);border-radius:12px;padding:14px 16px;margin-top:14px}
section h2{margin:0 0 8px;font-size:16px;color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}.tabs a{padding:5px 11px;border-radius:14px;background:#EEF1F7;cursor:pointer;font-size:13px}.tabs a.on{background:var(--navy);color:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:var(--mu);font-weight:600;padding:6px 8px;border-bottom:2px solid var(--ln);position:sticky;top:0;background:#fff;white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid #EEF1F7;vertical-align:top}td.n,th.n{text-align:right;white-space:nowrap}
tr.exp{cursor:pointer}tr.exp:hover td{background:#F7F9FD}tr.exp>td:first-child::before{content:"▸ ";color:var(--or);font-weight:700}tr.exp.open>td:first-child::before{content:"▾ "}
tr.det>td{background:#FAFBFE;padding:8px 8px 12px 26px;border-left:3px solid var(--or)}
.tag{display:inline-block;border-radius:9px;padding:1px 8px;font-size:11px;color:#fff;background:var(--mu);margin-right:3px}.t-r{background:var(--rd)}.t-a{background:var(--am)}.t-g{background:var(--gr)}.t-b{background:#5B7BB8}
a.doc,a.wt{color:#2a5db0;cursor:pointer;text-decoration:underline dotted}
.bars{display:flex;align-items:flex-end;gap:3px;height:130px;padding-top:16px}.bars div{flex:1;min-width:6px;background:#9DB2D6;border-radius:3px 3px 0 0;position:relative;cursor:pointer}.bars div:hover{background:var(--or)}
.bars div span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:10px;color:var(--mu);white-space:nowrap}
.bars div.cur{background:var(--or)}.bx{display:flex;gap:3px;font-size:10px;color:var(--mu)}.bx div{flex:1;text-align:center;min-width:6px;overflow:hidden}
.modal{position:fixed;inset:0;background:#0009;display:none;align-items:flex-start;justify-content:center;padding:30px 10px;z-index:50;overflow:auto}.modal.on{display:flex}
.modal .box{background:#fff;border-radius:14px;max-width:820px;width:100%;padding:18px 20px;position:relative}.modal .x{position:absolute;right:14px;top:10px;font-size:22px;cursor:pointer;color:var(--mu)}
.modal h3{margin:0 0 4px;color:var(--navy)}.kv{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:4px 14px;margin:10px 0;font-size:13px}.kv span{color:var(--mu)}
.note{color:var(--mu);font-size:12px;margin:6px 0}.hl{background:#FFF3E6}.badrow td{background:#FFF0F0}
.empty{color:var(--mu);padding:14px 0}
@media(max-width:640px){main{padding:10px}.card .v{font-size:20px}td,th{padding:5px 4px}}
</style></head><body>
<header><div><h1>ХИВА · Интерактивный дашборд</h1><div class="sub" id="sub"></div></div>
<div class="bar" id="ranges"></div>
<div class="bar"><input type="date" id="d0"><span>–</span><input type="date" id="d1"><input type="search" id="q" placeholder="Поиск по таблице…"><span id="chips"></span></div></header>
<main>
<div class="cards" id="cards"></div>
<section id="chart"><h2 id="chartTitle"></h2><div class="bars" id="bars"></div><div class="bx" id="bx"></div><div class="note">Нажмите на столбец — период сузится до этого дня.</div></section>
<section id="detail"></section>
<div class="note" style="margin:14px 0">Данные iiko. Всё раскрывается: нажмите на строку, чтобы увидеть заказы и накладные, «документ» откроет чек или накладную. Клик по имени официанта фильтрует весь дашборд.</div>
</main>
<div class="modal" id="modal"><div class="box"><span class="x" onclick="closeDoc()">×</span><div id="doc"></div></div></div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DAYS=JSON.parse(document.getElementById('data').textContent),META=__META__;
const $=s=>document.querySelector(s),fmt=n=>Math.round(+n||0).toLocaleString('ru-RU').replace(/ | /g,' '),money=n=>fmt(n)+' ₸',esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(a,b)=>b?(a/b*100):0,sum=(a,f)=>a.reduce((s,x)=>s+(f?f(x):x),0);
const WD=['вс','пн','вт','ср','чт','пт','сб'],rus=d=>d.split('-').reverse().join('.');
const ORD=[],PUR=[],EXPR=[],CASH=[],DNG=[],SHF=[],ACC=[],EDT=[];
DAYS.forEach(d=>{d.orders.forEach(o=>{o.d=d.date;o.id=ORD.length;ORD.push(o)});d.purchases.forEach(p=>{p.d=d.date;p.id=PUR.length;PUR.push(p)});
 d.expenses.forEach(e=>EXPR.push({d:d.date,a:e[0],ty:e[1],tx:e[2],w:e[3],s:e[4],doc:e[5]}));d.cash.forEach(e=>CASH.push({d:d.date,a:e[0],tx:e[1],i:e[2],o:e[3],w:e[4],doc:e[5]}));
 d.danger.forEach(e=>DNG.push({d:d.date,r:e[0],c:e[1],t:e[2],s:e[3],todo:e[4]}));d.shifts.forEach(e=>SHF.push({d:d.date,n:e[0],c:e[1],o:e[2],cl:e[3],cash:e[4],card:e[5],diff:e[6],st:e[7]}));
 (d.access||[]).forEach(e=>ACC.push({d:d.date,t:e[0],ty:e[1],who:e[2],code:e[3],st:e[4],by:e[5]}));(d.edits||[]).forEach(e=>EDT.push({d:d.date,t:e[0],by:e[1],ty:e[2],dty:e[3],n:e[4]}))});
const CONS=[],INV=[],STOCK=new Map(),PRICES=META.prices||{};
DAYS.forEach(d=>{(d.cons||[]).forEach(c=>CONS.push({d:d.date,st:c[0],p:c[1],q:c[2],s:c[3],ty:c[4]}));(d.inv||[]).forEach(c=>INV.push({d:d.date,st:c[0],p:c[1],q:c[2],s:c[3],doc:c[4]}))});
(META.stock||[]).forEach(r=>STOCK.set(r[0]+'|'+r[1],{st:r[0],p:r[1],g:r[2],u:r[3],q:r[4],s:r[5]}));
const RVM=(META.reviews||[]).find(x=>x.meta),RV=(META.reviews||[]).filter(x=>!x.meta);
const MIN=DAYS[0].date,MAX=DAYS[DAYS.length-1].date;
let S={a:MAX,b:MAX,metric:'rev',tab:0,waiter:null,q:'',stf:'all',ost:'Кухня склад',osup:'',ogrp:'',hz:3,win:7,need:true,small:false};
const addDays=(d,n)=>{const x=new Date(d+'T00:00:00Z');x.setUTCDate(x.getUTCDate()+n);return x.toISOString().slice(0,10)};
const diffDays=(a,b)=>Math.round((new Date(b)-new Date(a))/864e5)+1;
const inR=(d,a,b)=>d>=a&&d<=b;
const wf=o=>!S.waiter||o.w===S.waiter;
const orders=(a=S.a,b=S.b)=>ORD.filter(o=>inR(o.d,a,b)&&wf(o));
const paid=o=>!o.np&&o.n>0;
function kp(a,b){const os=orders(a,b),ps=paid?os.filter(paid):[];const rev=sum(os,o=>o.n),ch=ps.length,del=sum(os,o=>o.dt),aft=sum(os,o=>o.da),gross=sum(os,o=>o.g+o.dt);
 const disc=sum(os,o=>o.dc),comp=sum(os.filter(o=>o.np),o=>o.g),cost=sum(os,o=>sum(o.l.filter(l=>l[4]==0),l=>l[5]));
 const pu=sum(PUR.filter(p=>inR(p.d,a,b)&&p.st==='PROCESSED'),p=>p.sum);
 const ex=sum(EXPR.filter(e=>inR(e.d,a,b)&&(e.ty==='EXPENSES'||e.ty==='OTHER_EXPENSES')&&!['Зарплата','Дивиденды'].includes(e.a)),e=>e.s);
 const dg=DNG.filter(x=>inR(x.d,a,b));
 return{rev,ch,avg:ch?rev/ch:0,gu:sum(ps,o=>o.gu),delp:pct(del,gross),del,aft,disc:disc+comp,disc0:disc,comp,pu,ex,dn:dg.length,red:dg.filter(x=>x.r==3).length,fc:pct(cost,rev)}}
const CARDS=[
 {id:'rev',t:'Выручка',v:k=>money(k.rev),n:k=>k.rev,day:d=>sum(d.orders.filter(o=>wf(o)),o=>o.n),g:1},
 {id:'ch',t:'Чеков',v:k=>fmt(k.ch),n:k=>k.ch,day:d=>d.orders.filter(o=>wf(o)&&paid(o)).length,g:1},
 {id:'avg',t:'Средний чек',v:k=>money(k.avg),n:k=>k.avg,day:d=>{const x=d.orders.filter(o=>wf(o)&&paid(o));return x.length?sum(x,o=>o.n)/x.length:0},g:1},
 {id:'del',t:'Удалено (по меню)',v:k=>money(k.del),s:k=>k.delp.toFixed(1)+'% продаж · после печати '+money(k.aft),n:k=>k.del,day:d=>sum(d.orders.filter(wf),o=>o.dt),g:-1,cls:k=>k.aft>0||k.delp>8?'bad':k.delp>3?'warn':'ok'},
 {id:'disc',t:'Скидки и комплименты',v:k=>money(k.disc),s:k=>'скидки '+money(k.disc0)+' · комплименты '+money(k.comp),n:k=>k.disc,day:d=>sum(d.orders.filter(wf),o=>o.dc+(o.np?o.g:0)),g:-1},
 {id:'purch',t:'Закупки',v:k=>money(k.pu),s:k=>pct(k.pu,k.rev).toFixed(0)+'% выручки',n:k=>k.pu,day:d=>sum(d.purchases.filter(p=>p.st==='PROCESSED'),p=>p.sum),g:0},
 {id:'exp',t:'Прочие расходы',v:k=>money(k.ex),n:k=>k.ex,day:d=>sum(d.expenses.filter(e=>(e[1]==='EXPENSES'||e[1]==='OTHER_EXPENSES')&&!['Зарплата','Дивиденды'].includes(e[0])),e=>e[4]),g:-1},
 {id:'fc',t:'Food cost (расчётный)',v:k=>k.fc.toFixed(1)+'%',n:k=>k.fc,day:d=>{const os=d.orders.filter(wf),r=sum(os,o=>o.n);return r?sum(os,o=>sum(o.l.filter(l=>l[4]==0),l=>l[5]))/r*100:0},g:-1,cls:k=>k.fc>50?'bad':k.fc>42?'warn':'ok'},
 {id:'dng',t:'Опасные операции',v:k=>fmt(k.dn),s:k=>'критических '+k.red,n:k=>k.dn,day:d=>d.danger.length,g:-1,cls:k=>k.red>0?'bad':k.dn>10?'warn':'ok'},
 {id:'cash',t:'Деньги и смены',v:k=>fmt(SHF.filter(x=>inR(x.d,S.a,S.b)).length)+' смен',s:k=>'расхождений: '+SHF.filter(x=>inR(x.d,S.a,S.b)&&x.diff!=0).length,n:k=>0,day:d=>d.shifts.length,g:0},
 {id:'rv',t:'Отзывы 2ГИС',v:k=>{const r=RV.filter(x=>inR(x.d,S.a,S.b));return fmt(r.length)+' отз.'},s:k=>{const r=RV.filter(x=>inR(x.d,S.a,S.b)),n=r.filter(x=>x.r<=4).length;return 'негативных '+n+(RVM?' · рейтинг '+RVM.meta.rating:'')},n:k=>RV.filter(x=>inR(x.d,S.a,S.b)).length,day:d=>RV.filter(x=>x.d===d.date).length,g:1,cls:k=>RV.filter(x=>inR(x.d,S.a,S.b)&&x.r<=4).length?'warn':'ok'},
 {id:'order',t:'Заказ (норма)',v:k=>{const r=orderRows().filter(x=>x.need>0);return fmt(r.length)+' поз.'},s:k=>{const r=orderRows().filter(x=>x.need>0);return '≈'+money(sum(r,x=>x.cost))+' на '+S.hz+' дн. · '+esc(S.ost||'все склады')},n:k=>0,day:d=>sum((d.cons||[]).filter(c=>c[4]==1),c=>c[3]),g:0,cls:k=>orderRows().filter(x=>x.need>0&&x.cover!==null&&x.cover<1).length?'warn':'ok'},
 {id:'inv',t:'Инвентаризации',v:k=>fmt(new Set(INV.filter(x=>inR(x.d,S.a,S.b)).map(x=>x.d+x.doc+x.st)).size)+' актов',s:k=>{const v=INV.filter(x=>inR(x.d,S.a,S.b));return 'недостачи '+money(sum(v.filter(x=>x.s<0),x=>x.s))+' · излишки +'+fmt(sum(v.filter(x=>x.s>0),x=>x.s))},n:k=>0,day:d=>sum((d.inv||[]),c=>Math.abs(c[3])),g:0},
 {id:'acc',t:'Доступы и правки',v:k=>fmt(ACC.filter(x=>inR(x.d,S.a,S.b)).length)+' изм.',s:k=>'правок документов: '+EDT.filter(x=>inR(x.d,S.a,S.b)).length,n:k=>0,day:d=>(d.access||[]).length+(d.edits||[]).length,g:0}];
function delta(c,k,kp_){if(!c.n||addDays(S.a,-diffDays(S.a,S.b))<MIN)return'';const a=c.n(k),b=c.n(kp_);if(!b)return'<span class="nt">—</span>';const p=(a/b-1)*100,good=c.g===0?null:(c.g>0?p>=0:p<=0);return`<span class="${good===null?'nt':good?'up':'dn'}">${p>=0?'▲':'▼'} ${Math.abs(p).toFixed(0)}% к прошлому периоду</span>`}
function spark(c){const days=DAYS.filter(d=>d.date<=S.b).slice(-14);if(days.length<2)return'';const v=days.map(d=>c.day(d)),m=Math.max(...v)||1;const w=70,h=26;return`<svg class="spark" width="${w}" height="${h}">${v.map((x,i)=>`<rect x="${i*(w/v.length)}" y="${h-x/m*h}" width="${w/v.length-1}" height="${x/m*h}" fill="#9DB2D6"/>`).join('')}</svg>`}
function renderCards(){const n=diffDays(S.a,S.b),pa=addDays(S.a,-n),pb=addDays(S.a,-1),k=kp(S.a,S.b),k0=kp(pa,pb);
 $('#cards').innerHTML=CARDS.map(c=>`<div class="card ${c.cls?c.cls(k):''} ${S.metric===c.id?'act':''}" onclick="setMetric('${c.id}')"><h3>${c.t}</h3><div class="v">${c.v(k)}</div><div class="d">${delta(c,k,k0)}${c.s?`<div class="nt">${c.s(k)}</div>`:''}</div>${spark(c)}</div>`).join('')}
function renderChart(){const c=CARDS.find(x=>x.id===S.metric)||CARDS[0];$('#chartTitle').textContent=c.t+' по дням';let days=DAYS.filter(d=>d.date<=addDays(S.b,0)&&d.date>=addDays(S.b,-29));const v=days.map(d=>c.day(d)),m=Math.max(...v)||1;
 $('#bars').innerHTML=days.map((d,i)=>`<div class="${inR(d.date,S.a,S.b)?'cur':''}" style="height:${Math.max(2,v[i]/m*100)}%" title="${rus(d.date)}: ${c.id==='fc'||c.id==='del'&&0?v[i].toFixed(1):fmt(v[i])}" onclick="setRange('${d.date}','${d.date}')">${days.length<=16?`<span>${c.id==='fc'?v[i].toFixed(0)+'%':fmt(v[i]/(m>5e4?1000:1))+(m>5e4?'к':'')}</span>`:''}</div>`).join('');
 $('#bx').innerHTML=days.map(d=>`<div>${d.date.slice(8)}<br>${WD[new Date(d.date+'T00:00:00Z').getUTCDay()]}</div>`).join('')}
/* ---------- аккордеон ---------- */
const REG={};let uid=0;
function tbl(h,rows,opt={}){if(!rows.length)return'<div class="empty">Нет данных за выбранный период</div>';return`<table><thead><tr>${h.map((x,i)=>`<th class="${opt.n&&opt.n.includes(i)?'n':''}">${x}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table>`}
function row(cells,child,opt={}){const id='r'+(uid++);if(child)REG[id]=child;return`<tr class="${child?'exp':''} ${opt.cls||''}" data-id="${id}" data-n="${cells.length}">${cells.map((c,i)=>`<td class="${opt.n&&opt.n.includes(i)?'n':''}">${c}</td>`).join('')}</tr>`}
document.addEventListener('click',e=>{const a=e.target.closest('a.wt');if(a){S.waiter=a.dataset.w;renderAll();e.stopPropagation();return}
 const dc=e.target.closest('a.doc');if(dc){openDoc(dc.dataset.t,+dc.dataset.i);e.stopPropagation();return}
 const tr=e.target.closest('tr.exp');if(!tr||e.target.closest('a'))return;const nx=tr.nextElementSibling;
 if(nx&&nx.classList.contains('det')){nx.remove();tr.classList.remove('open');return}
 const d=document.createElement('tr');d.className='det';d.innerHTML=`<td colspan="${tr.dataset.n}">${REG[tr.dataset.id]()}</td>`;tr.after(d);tr.classList.add('open')});
const W=w=>`<a class="wt" data-w="${esc(w)}" title="Фильтровать по официанту">${esc(w||'—')}</a>`;
const DOC=o=>`<a class="doc" data-t="o" data-i="${o.id}">документ</a>`;
const st=l=>l[4]==0?'':l[4]==3?'<span class="tag t-r">удалено ПОСЛЕ печати</span>':l[4]==2?'<span class="tag t-a">заказ удалён до печати</span>':'<span class="tag t-b">удалено до печати</span>';
const linesT=o=>tbl(['Блюдо','Кол-во','Сумма по меню','Оплачено','Статус'],o.l.map(l=>row([esc(l[0]),l[1],money(l[2]),money(l[3]),st(l)],null,{n:[1,2,3],cls:l[4]?'badrow':''})),{n:[1,2,3]});
function ordersT(os,opt={}){os=[...os].sort((a,b)=>(opt.by?opt.by(b)-opt.by(a):(a.d+a.t<b.d+b.t?-1:1)));const cut=os.length>150?os.slice(0,150):os;
 return tbl(['Дата','Время','Стол','Гостей','Официант','Кассир','Сумма','Оплата','Флаги',''],cut.map(o=>row([rus(o.d),o.t+'–'+o.c,esc(o.tb),o.gu,W(o.w),esc(o.ca),opt.del?money(o.dt):money(o.n),esc(o.pay),flags(o),DOC(o)],()=>linesT(o),{n:[3,6]})),{n:[3,6]})+(os.length>cut.length?`<div class="note">Показано ${cut.length} из ${os.length} (по убыванию суммы). Сузьте период или используйте фильтр по официанту.</div>`:'')}
